<style>
    body {
        font-family: Arial;
        margin: 30px;
    }

    button {
        padding: 10px 15px;
        margin: 5px;
        cursor: pointer;
    }

    #message {            
        margin-top: 20px;
        padding: 15px;
        background: #eef6f7;
        border-radius: 6px;
        }
</style>

<body>

<h1>Telehealth Portal</h1>
<p>Welcome to the telehealth page.</p>

<button onclick="startVisit()">Start Visit</button>
<button onclick="schedule()">Schedule Appointment</button>
<button onclick="contact()">Contact Us</button>

<div id="message"></div>


<script>
    function showMessage(content) {
        const message = document.getElementById("message");
        message.innerHTML = content;
        message.style.display = "block";
    }

    function startVisit() {
        showMessage(
            "<h3>Welcome</h3>"
        );
    }

    function schedule() {
        showMessage(
            "<h3>Appointment confirmed</h3>"
        );
    }

    function contact() {
        showMessage(
            "<h3>Email: info@example.com</h3>"
        );
    }
</script>

</body>
